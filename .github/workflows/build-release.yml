name: Build & Release Fel7o

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Extract ffmpeg from zip
        run: 7z e bin/ffmpeg.zip -obin/ ffmpeg.exe -y
        shell: cmd

      - name: Verify ffmpeg extracted
        shell: pwsh
        run: |
          $f = Get-Item "bin\ffmpeg.exe"
          Write-Host "ffmpeg.exe size: $([math]::Round($f.Length/1MB,1)) MB"

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
          name: Fel7o ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
